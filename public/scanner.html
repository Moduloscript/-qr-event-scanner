<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Check-In Scanner</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" integrity="sha512-r6rDA7W6ZeQXYt8GPQb9hQ0Srd575qK2150M9ZpghGWZ2M1wSO5zg42Ea7JVpAMCXyDd60N4xWYdTo4w54C9EA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        .scanner-card {
            max-width: 500px;
            margin: 0 auto;
        }
        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .viewfinder-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            border: none !important;
        }
        #reader__dashboard_section_csr button {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px auto;
        }
        .manual-lookup-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 16px;
        }
        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.01);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .guest-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Auth Warning Panel -->
        <div id="auth-warning" class="glass-panel" style="display: none; text-align: center; max-width: 480px; margin: 40px auto;">
            <div class="scan-overlay-icon" style="color: var(--error);">⚠️</div>
            <h2>Access Unauthorized</h2>
            <p style="margin: 16px 0; color: var(--text-secondary);">
                This scanner requires a valid access token. Please verify the URL contains the secure scanner token key.
            </p>
        </div>

        <!-- Scanner Interface -->
        <div id="scanner-interface" class="scanner-card glass-panel" style="display: none;">
            <div class="header-section">
                <h1 id="scanner-title">Access Scanner</h1>
                <p id="scanner-subtitle" style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 4px;">Loading event details...</p>
            </div>

            <!-- Tab Header -->
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('scan-tab')">Scan Ticket</button>
                <button class="tab-btn" onclick="switchTab('lookup-tab')">Guest Lookup</button>
            </div>

            <!-- Tab 1: Scan Camera -->
            <div id="scan-tab" class="tab-content active">
                <div class="viewfinder-wrapper">
                    <div class="scanner-laser"></div>
                    <div id="reader"></div>
                </div>
                <div style="text-align: center; margin-top: 16px;">
                    <p style="font-size: 0.85rem; color: var(--text-secondary);">Position the QR code inside the camera view area.</p>
                </div>
            </div>

            <!-- Tab 2: Manual Lookup -->
            <div id="lookup-tab" class="tab-content">
                <div class="form-group">
                    <input type="text" id="search-input" class="form-control" placeholder="Search by name or email..." oninput="handleSearch()">
                </div>
                <div class="manual-lookup-list" id="guest-lookup-results">
                    <!-- Dynamic List -->
                    <p style="text-align: center; color: var(--text-muted); padding: 20px;">Type to search guests...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scan Results Overlays -->
    <div id="scan-overlay" class="scan-overlay">
        <div class="scan-overlay-content">
            <div id="overlay-icon" class="scan-overlay-icon">✅</div>
            <div id="overlay-title" class="scan-overlay-title">Valid Ticket</div>
            <p id="overlay-desc" class="scan-overlay-desc">Welcome to the event</p>
            <div style="margin-top: 24px;">
                <button class="btn btn-secondary btn-sm" onclick="dismissOverlay()">Dismiss (or wait)</button>
            </div>
        </div>
    </div>

    <script src="js/scanner.js"></script>
</body>
</html>
