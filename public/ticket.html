<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Event Ticket</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/qrcode.min.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: var(--error);
        }
    </style>
</head>

<body>
    <div class="ticket-card" id="ticket-container" style="display: none;">
        <div class="ticket-header">
            <h2 id="event-name">Event Name</h2>
            <p id="event-venue" style="opacity: 0.8; margin-top: 4px;">Venue Location</p>
        </div>

        <div class="ticket-cutout-left"></div>
        <div class="ticket-cutout-right"></div>

        <div class="ticket-body">
            <div class="ticket-qr" id="qrcode"></div>

            <div class="ticket-info">
                <div class="ticket-row">
                    <span class="ticket-row-label">Guest Name</span>
                    <span class="ticket-row-value" id="guest-name">John Doe</span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-row-label">Ticket Tier</span>
                    <span class="ticket-row-value" id="ticket-tier" style="text-transform: uppercase;">VIP</span>
                </div>
                <div class="ticket-row">
                    <span class="ticket-row-label">Date & Time</span>
                    <span class="ticket-row-value" id="event-time">--/--/-- --:--</span>
                </div>
            </div>
        </div>
    </div>

    <div id="error-container" class="glass-panel error-message" style="display: none; max-width: 400px; margin: auto;">
        <h2>Ticket Error</h2>
        <p id="error-text" style="margin-top: 12px;"></p>
    </div>

    <script src="js/ticket.js"></script>
</body>

</html>
